<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" role="img" aria-labelledby="chartTitle chartDesc">
  <title id="chartTitle">ChatGPT long chat: interaction latency before / after</title>
  <desc id="chartDesc">Input p95 falls from 376 ms to 160 ms, menu click p95 from 696 ms to 176 ms, and near-bottom scroll long tasks from about 1900 ms to 136 ms.</desc>
  <rect x="0.5" y="0.5" width="839" height="379" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#0f172a">ChatGPT long chat: interaction latency before / after</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">Same 0–2000 ms scale; lower is better; managed Chromium long-chat sample</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#334155">
    <line x1="200" y1="88" x2="200" y2="312" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="325" y1="88" x2="325" y2="312" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="450" y1="88" x2="450" y2="312" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="575" y1="88" x2="575" y2="312" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="700" y1="88" x2="700" y2="312" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="40" y="118" font-weight="600">Input p95</text>
    <rect x="200" y="100" width="94" height="22" rx="4" fill="#94a3b8"/>
    <text x="302" y="116" font-size="12" fill="#475569">376 ms</text>
    <rect x="200" y="128" width="40" height="22" rx="4" fill="#2563eb"/>
    <text x="248" y="144" font-size="12" fill="#1d4ed8">160 ms (-57%)</text>
        <text x="40" y="198" font-weight="600">Menu click p95</text>
    <rect x="200" y="180" width="174" height="22" rx="4" fill="#94a3b8"/>
    <text x="382" y="196" font-size="12" fill="#475569">696 ms</text>
    <rect x="200" y="208" width="44" height="22" rx="4" fill="#2563eb"/>
    <text x="252" y="224" font-size="12" fill="#1d4ed8">176 ms (-75%)</text>
        <text x="40" y="278" font-weight="600">Scroll long tasks</text>
    <rect x="200" y="260" width="475" height="22" rx="4" fill="#94a3b8"/>
    <text x="683" y="276" font-size="12" fill="#475569">1900 ms</text>
    <rect x="200" y="288" width="34" height="22" rx="4" fill="#2563eb"/>
    <text x="242" y="304" font-size="12" fill="#1d4ed8">136 ms (-93%)</text>
    <text x="200" y="334" text-anchor="middle" font-size="11" fill="#94a3b8">0</text><text x="325" y="334" text-anchor="middle" font-size="11" fill="#94a3b8">500</text><text x="450" y="334" text-anchor="middle" font-size="11" fill="#94a3b8">1000</text><text x="575" y="334" text-anchor="middle" font-size="11" fill="#94a3b8">1500</text><text x="700" y="334" text-anchor="middle" font-size="11" fill="#94a3b8">2000</text>
    <text x="720" y="334" font-size="11" fill="#94a3b8">ms</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">
    <rect x="40" y="354" width="12" height="12" rx="2" fill="#94a3b8"/><text x="60" y="365">Before</text><rect x="120" y="354" width="12" height="12" rx="2" fill="#2563eb"/><text x="140" y="365">After</text><text x="700" y="365" fill="#94a3b8">0.4.0 sample</text>
  </g>
</svg>